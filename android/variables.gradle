ext {
    // Android 8.0. Chosen deliberately: the game needs WebGL 2 (OpenGL ES 3.0)
    // and uses vector adaptive launcher icons, both of which are API 26+. This
    // still covers the overwhelming majority of active Android devices, and
    // avoids shipping a 3D game to hardware that would run it badly.
    minSdkVersion = 26
    compileSdkVersion = 35
    targetSdkVersion = 35
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'
}